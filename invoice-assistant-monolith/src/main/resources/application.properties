invoice-assistant.data-root=${user.home}/.invoice-assistant
%dev.invoice-assistant.data-root=${user.dir}/target/invoice-assistant-demo
%dev.invoice-assistant.settings.seed=/defaults/dev-settings.yaml
invoice-assistant.max-upload-bytes=2900000
invoice-assistant.max-upload-files=20
invoice-assistant.max-upload-batch-bytes=104857600
invoice-assistant.pdf.max-pages=25
invoice-assistant.pdf.max-extracted-characters=250000
invoice-assistant.pdf.max-scratch-bytes=67108864
invoice-assistant.analysis.mode=real
pipeline.orchestrator.mode=QUEUE_ASYNC
pipeline.orchestrator.state-provider=memory
pipeline.orchestrator.dispatcher-provider=event
pipeline.orchestrator.dlq-provider=log
pipeline.orchestrator.idempotency-policy=CLIENT_KEY_REQUIRED
pipeline.defaults.retry-limit=0
pipeline.orchestrator.max-retries=0
%dev.pipeline.llm.langchain4j.ollama.request-timeout=PT60S
%dev.pipeline.llm.langchain4j.ollama.thinking=false
pipeline.orchestrator.worker.allowed-payload-prefixes[0]=com.mokapotlabs.invoiceassistant.
pipeline.orchestrator.worker.allowed-payload-prefixes[1]=org.pipelineframework.
pipeline.orchestrator.strict-startup=true
quarkus.devservices.enabled=false
pipeline.cache.provider=memory
pipeline.cache.policy=prefer-cache
persistence.duplicate-key=ignore
persistence.provider.class=org.pipelineframework.plugin.persistence.provider.VThreadPersistenceProvider
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${invoice-assistant.data-root}/database/invoice-assistant;AUTO_SERVER=TRUE
quarkus.datasource.username=invoice-assistant
quarkus.datasource.password=invoice-assistant
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:invoice-assistant;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.grpc.server.use-separate-server=false
quarkus.index-dependency.tpf-llm-langchain4j.group-id=org.pipelineframework
quarkus.index-dependency.tpf-llm-langchain4j.artifact-id=llm-query-langchain4j-connector
quarkus.http.limits.max-body-size=106954752
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=${invoice-assistant.data-root}/tmp/uploads
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.host=127.0.0.1
quarkus.http.port=${invoice-assistant.http.port:0}
assistant-local.instance-name=invoice
assistant-local.ui.open-browser=${invoice-assistant.ui.open-browser:true}
quarkus.otel.sdk.disabled=true
quarkus.log.file.enabled=true
quarkus.log.file.path=${invoice-assistant.data-root}/logs/application.log
invoice-assistant.delivery.adapter=graph
invoice-assistant.ui.open-browser=true
invoice-assistant.accountant.recipient=

quarkus.index-dependency.invoice-payloads.group-id=com.mokapotlabs.invoiceassistant
quarkus.index-dependency.invoice-payloads.artifact-id=invoice-payload-boundaries

invoice-assistant.graph.client-id=${INVOICE_ASSISTANT_GRAPH_CLIENT_ID:}

quarkus.index-dependency.decision-jev.group-id=org.pipelineframework
quarkus.index-dependency.decision-jev.artifact-id=decision-query-jev-connector
%dev.pipeline.decision.jev.request-timeout=60s
%prod.pipeline.decision.jev.request-timeout=60s
%prod.pipeline.llm.langchain4j.ollama.request-timeout=PT60S
%prod.pipeline.llm.langchain4j.ollama.thinking=false
