invoice-assistant.data-root=${java.io.tmpdir}/invoice-assistant-oss-tests
invoice-assistant.max-upload-bytes=2900000
invoice-assistant.settings.seed=/defaults/test-settings.yaml
invoice-assistant.test-reset-data-root=true
invoice-assistant.pdf.validation-enabled=false
invoice-assistant.ui.open-browser=false
pipeline.defaults.retry-limit=0
pipeline.orchestrator.max-retries=0
quarkus.http.limits.max-body-size=${invoice-assistant.max-upload-bytes}
quarkus.arc.exclude-types=org.pipelineframework.connector.llm.langchain4j.LangChain4jOllamaQueryConnector,org.pipelineframework.connector.llm.langchain4j.LangChain4jOpenAiCompatibleQueryConnector,org.pipelineframework.connector.decision.jev.JevDecisionQueryConnector
invoice-assistant.delivery.adapter=fake
quarkus.http.test-port=0
